<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Productos | Paisabor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <nav class="navbar-paisabor">
        <div class="logo">
            <img src="logo.jpg" alt="Logo Paisabor">
            <h1>Admin — Productos</h1>
        </div>
        <div class="navbar-links">
            <a href="/admin-productos.html" class="nav-activo">Productos</a>
            <a href="/admi_eventos.html">Eventos</a>
            <a href="/index.html">← Sitio</a>
            <button class="btn-logout" id="btn-logout">
                <span class="material-symbols-outlined">logout</span>
                Salir
            </button>
        </div>
    </nav>

    <main class="admin-layout">

        <!-- Formulario agregar producto -->
        <div class="admin-panel">
            <h2>
                <span class="material-symbols-outlined">add_circle</span>
                Agregar Producto
            </h2>

            <div class="admin-form">
                <div class="form-grupo">
                    <label for="nombre">Nombre del producto *</label>
                    <input type="text" id="nombre" placeholder="Ej: Empanadas de pipián">
                </div>

                <div class="form-grupo">
                    <label for="descripcion">Descripción *</label>
                    <textarea id="descripcion" rows="3" placeholder="Describe el producto..."></textarea>
                </div>

                <div class="form-grupo">
                    <label for="precio">Precio de venta (€) *</label>
                    <input type="number" id="precio" placeholder="Ej: 8.50" step="0.01" min="0">
                </div>

                <div class="form-grupo">
                    <label for="stock">Stock inicial *</label>
                    <input type="number" id="stock" placeholder="Ej: 20" min="0">
                </div>

                <div class="form-grupo">
                    <label for="categoria">Categoría *</label>
                    <select id="categoria">
                        <option value="">Selecciona una categoría...</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label>Imagen del producto</label>
                    <div class="upload-area" id="upload-area">
                        <span class="material-symbols-outlined">cloud_upload</span>
                        <p>Arrastra una imagen aquí o haz clic para seleccionar</p>
                        <input type="file" id="imagen-input" accept="image/*" style="display:none">
                    </div>
                    <div class="imagen-preview oculto" id="imagen-preview">
                        <img id="preview-img" src="" alt="Preview">
                        <button class="btn-quitar-img" id="btn-quitar-img">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                </div>

                <button class="btn-primario" id="btn-agregar">
                    <span class="material-symbols-outlined">add</span>
                    Agregar producto
                </button>

                <p class="form-mensaje oculto" id="form-mensaje"></p>
            </div>
        </div>

        <!-- Lista de productos -->
        <div class="admin-panel">
            <h2>
                <span class="material-symbols-outlined">inventory_2</span>
                Productos registrados
            </h2>
            <div class="admin-search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="buscador" placeholder="Buscar producto...">
            </div>
            <div id="admin-lista-productos"></div>
        </div>

    </main>

    <script src="admin-productos.js"></script>
</body>
</html>
