<body class="bg-surface font-body text-on-surface h-screen w-full relative overflow-hidden flex items-center justify-center">
<!-- Background Image with Overlay -->

<div class="absolute inset-0 z-0 bg-surface/20 backdrop-blur-sm"></div>
<!-- Central Login Card -->
<main class="relative z-10 w-full max-w-md mx-4 md:mx-auto bg-surface-container-lowest rounded-xl p-8 md:p-12 shadow-[0_40px_40px_-10px_rgba(28,28,25,0.05)]">
<header class="mb-10 text-center"><div class="flex justify-center mb-4"><div class="h-20 w-20 rounded-full bg-surface-container-high border border-surface-container-highest overflow-hidden flex items-center justify-center shadow-sm"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYNzKV1q-8t7Ox2DJSYKLn9qkiC4A3gGX6x2QXKYieoKbn3dc8iT_OSwgvIow3lGEOtY0FfB-bwCpvJk3m4SoqiJRZItb5tBAIoo8YTMc4rvzWZq8EZsL_LJbhNGxjVepNlaBbHSamREbcGQbwpVEohEd53UmhIYUcLdF-De4kV7xHQy_xA1NwxODMswdCetUTbKol940iFCE9E93K23UrZUzxFZBh2O_Dxrk3rTgG1IXFXjEevpebv4Y8IKqgwY7jCQ" alt="Paisabor Logo" class="w-full h-full object-contain p-2"></div></div>
<h1 class="font-headline text-display text-4xl md:text-5xl font-extrabold text-primary tracking-tighter mb-2 mt-2">Paisabor</h1>
<p class="font-body text-on-surface-variant text-sm md:text-base">Del Corazón de Colombia</p>
</header>
<form action="#" class="flex flex-col gap-8" method="POST">
<!-- Username Input -->
<div class="relative group">
<label class="block font-body text-xs text-on-surface-variant mb-2 uppercase tracking-[0.1em] font-medium" for="username">Nombre de Usuario</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b-2 border-surface-container-highest px-0 py-2 text-on-surface font-body text-lg focus:ring-0 focus:border-secondary transition-colors placeholder-outline-variant/50" id="username" name="username" placeholder="Ingresa tu usuario" required="" type="text">
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-secondary transition-colors" data-icon="person">person</span>
</div>
</div>
<!-- Password Input -->
<div class="relative group">
<label class="block font-body text-xs text-on-surface-variant mb-2 uppercase tracking-[0.1em] font-medium" for="password">Contraseña</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b-2 border-surface-container-highest px-0 py-2 text-on-surface font-body text-lg focus:ring-0 focus:border-secondary transition-colors placeholder-outline-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Mostrar contraseña" class="absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant hover:text-secondary group-focus-within:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end -mt-4">
<a class="font-body text-sm text-secondary hover:text-primary transition-colors duration-300" href="#">¿Olvidé mi contraseña?</a>
</div>
<!-- Main Action Button -->
<button class="w-full mt-4 bg-primary text-on-primary font-headline font-bold text-lg py-4 rounded-lg hover:bg-primary-container hover:-translate-y-1 transition-all duration-300 shadow-lg shadow-primary/20" type="submit">
                Entrar
            </button>
</form>
<!-- Footer / Create Account -->
<div class="mt-10 text-center border-t border-surface-container-highest pt-6">
<p class="font-body text-on-surface-variant text-sm">
                ¿Aún no tienes el sabor en casa? 
                <a class="font-headline font-bold text-secondary hover:text-primary transition-colors ml-1" href="#">Crear cuenta</a>
</p>
</div>
